name: Build PULSO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - pulso-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar archivos web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Instalar puente nativo y permisos
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/lyqentra/pulso
          cp native/android/app/src/main/java/com/lyqentra/pulso/*.java android/app/src/main/java/com/lyqentra/pulso/
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit(f'No se encontró el manifiesto generado: {manifest}')

          text = manifest.read_text(encoding='utf-8')
          match = re.search(r'<manifest\b[^>]*>', text)
          if not match:
              raise SystemExit('AndroidManifest.xml no contiene una etiqueta <manifest> válida')

          permissions = [
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECORD_AUDIO'
          ]
          additions = []
          if permissions[0] not in text:
              additions.append('    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />')
          if permissions[1] not in text:
              additions.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
          for permission in permissions[2:]:
              if permission not in text:
                  additions.append(f'    <uses-permission android:name="{permission}" />')

          app_match = re.search(r'<application\b[^>]*>', text)
          if not app_match:
              raise SystemExit('AndroidManifest.xml no contiene <application>')
          if 'PulsoPlaybackService' not in text:
              service = '\n        <service android:name="com.lyqentra.pulso.PulsoPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback">\n            <intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter>\n        </service>'
              text = text[:app_match.end()] + service + text[app_match.end():]

          if additions:
              insert_at = match.end()
              text = text[:insert_at] + '\n' + '\n'.join(additions) + text[insert_at:]
          manifest.write_text(text, encoding='utf-8')

          # Verifica que el XML siga siendo válido antes de compilar.
          import xml.etree.ElementTree as ET
          ET.parse(manifest)
          print('AndroidManifest.xml válido; permisos de audio configurados.')
          PY

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
